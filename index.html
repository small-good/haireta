<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ハイレタ！</title>

    <link rel="apple-touch-icon" sizes="180x180" href="./images/haireta-icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="phone">

        <!-- ロゴ -->
        <div class="logo">

            <img src="icons/logo.png" alt="ハイレタ！" class="logo-img">

            <p class="logo-copy">
                子連れのお店探しを、<br>
                もっとラクに。
            </p>

        </div>


        <!-- 条件で絞り込む -->
        <section class="search-card" id="filterSection">
            <div class="section-heading">

                <div class="section-title-row">

                    <img src="icons/filter.png" alt="" class="section-icon-img">

                    <div class="section-title">
                        条件で絞り込む
                        <span class="required-badge">
                            必須
                        </span>
                    </div>

                </div>

                <div class="section-description">
                    子連れ条件に当てはまるお店だけを検索します。<br>
                    1つ以上選択してください（複数選択可）
                </div>

            </div>


            <div class="filters">

                <!-- 子ども椅子 -->
                <label class="filter-card">

                    <input type="checkbox" id="chair" checked>

                    <img src="icons/child-chair.png" class="filter-icon" alt="">

                    <span>
                        子ども椅子
                    </span>

                </label>


                <!-- ベビーカー -->
                <label class="filter-card">

                    <input type="checkbox" id="stroller">

                    <img src="icons/stroller.png" class="filter-icon" alt="">

                    <span>
                        ベビーカー入店
                    </span>

                </label>


                <!-- 子連れ歓迎 -->
                <label class="filter-card">

                    <input type="checkbox" id="friendly">

                    <img src="icons/family-friendly.png" class="filter-icon" alt="">

                    <span>
                        子連れ歓迎
                    </span>

                </label>

            </div>

            <!-- 条件未選択時のエラー -->
            <div id="filterError" class="filter-error" role="alert" aria-live="polite">
                子連れ条件を1つ以上選択してください。
            </div>

        </section>


        <!-- ジャンル -->
        <section class="search-card">

            <div class="section-heading">

                <div class="section-title-row">

                    <img src="icons/genre.png" alt="" class="section-icon-img">

                    <div class="section-title">
                        ジャンル
                        <span class="optional">
                            （任意）
                        </span>
                    </div>

                </div>

                <div class="section-description">
                    食べたいジャンルを選択してください
                </div>

            </div>


            <select id="genre" class="genre-select">

                <option value="">
                    ジャンルを選択
                </option>

                <option value="アジア料理">アジア料理</option>
                <option value="居酒屋">居酒屋</option>
                <option value="イタリアン">イタリアン</option>
                <option value="うどん・そば">うどん・そば</option>
                <option value="お好み焼き・粉もの">お好み焼き・粉もの</option>
                <option value="各国料理">各国料理</option>
                <option value="カフェ・スイーツ">カフェ・スイーツ</option>
                <option value="カレー">カレー</option>
                <option value="寿司">寿司</option>
                <option value="ステーキ・鉄板料理">ステーキ・鉄板料理</option>
                <option value="ダイニング・バー">ダイニング・バー</option>
                <option value="中華">中華</option>
                <option value="丼・定食">丼・定食</option>
                <option value="鍋">鍋</option>
                <option value="ビストロ・フレンチ">ビストロ・フレンチ</option>
                <option value="ファストフード">ファストフード</option>
                <option value="ファミレス">ファミレス</option>
                <option value="焼肉">焼肉</option>
                <option value="洋食">洋食</option>
                <option value="ラーメン">ラーメン</option>
                <option value="和食">和食</option>
                <option value="その他">その他</option>

            </select>

        </section>


        <!-- キーワード -->
        <section class="search-card">

            <div class="section-heading">

                <div class="section-title-row">

                    <img src="icons/keyword.png" alt="" class="section-icon-img">

                    <div class="section-title">
                        キーワード
                        <span class="optional">
                            （任意）
                        </span>
                    </div>

                </div>
                <div class="section-description">
                    住所・店名・特徴などを入力してください
                </div>

            </div>


            <input type="text" id="keyword" class="keyword-input" placeholder="例）大森、バンボ、食器など">

        </section>

        <!-- 検索 -->
        <div class="search-buttons">

            <button class="view-btn list-view-btn" id="listBtn">
                一覧で見る
            </button>

            <button class="view-btn map-view-btn" id="mapBtn">
                地図で見る
            </button>

        </div>

        <!-- 補足 -->
        <div class="search-guide">

            <img src="icons/lightbulb.png" alt="" class="guide-icon">

            <div>
                ご意見・お店情報をお待ちしています<br>
                X（@haireta_team）までお気軽にどうぞ
            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
